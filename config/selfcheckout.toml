name = "mediathek:selfcheckout:01"
wsbroker = "websocket-broker.k8s-tls.ub.unibas.ch"
channels = ["mediathek01"]

[tunnel]
remote_addr = "slsp-ubs.alma.exlibrisgroup.com:6443"
certificate_file = "certs/slsp/client.crt"
key_file = "certs/slsp/client.key"
# Empty uses the system trust store for the Alma server certificate.
ca_file = "certs/slsp/ca.pem"
# Duration in nanoseconds (200 seconds).
connect_timeout = 200000000000

[sip2]
username = ""
password = ""
location = ""

[clienttls]
type = "minivault"

[clienttls.minivault]
baseurl = "https://minivault.grpc-system.k8s.ub.unibas.ch/api/v1"
parenttoken = "%%PARENT_TOKEN%%"
tokentype = "client_cert"
tokenpolicies = ["wsbroker.client"]
certtype = "client_cert"
uris = ["wsbroker:client:mediathek:selfcheckout:01", "wsbroker:channel:mediathek01"]
ca = ["certs/minivault_switch.ca.pem", "certs/minivault.ca.pem"]
usesystempool = false