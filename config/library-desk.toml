addr = "localhost:5000"
extaddr = "http://localhost:5000"
name = "mediathek:desk:01"
#wsbroker = "https://ws.k8s.ub.unibas.ch"
wsbroker = "websocket-broker.k8s-tls.ub.unibas.ch"
channels = ["mediathek01"]
default_isil = "CH-001596-0"
default_afi = "07"
max_tags = 100

# Optional Elasticsearch configuration. The API key is read from the environment.
[elasticsearch]
endpoint = ["https://elastic.med.campusderkuenste.ch/"]
index = "fhnw_alma-full"
apikey = "%%ELASTIC_APIKEY%%"

[themes]
#dark = "mediathek-dark"
#light = "mediathek-light"

[inventory]
enabled = true

[inventory.webservice]
target_url = "https://inventory.med.hgk.fhnw.ch/inventory"
http_method = "POST"
jwt_key = "%%INVENTORY_JWT_KEY%%"
debug_mode = false
timeout = "5s"

[clienttls]
type = "minivault"

[clienttls.minivault]
#baseurl = "https://localhost:8759/api/v1"
baseurl = "https://minivault.grpc-system.k8s.ub.unibas.ch/api/v1"
parenttoken = "%%PARENT_TOKEN%%"
tokentype = "client_cert"
tokenpolicies = ["wsbroker.client"]
certtype = "client_cert"
uris = ["wsbroker:client:mediathek:desk:01", "wsbroker:channel:mediathek01"]
ca = ["certs/minivault_switch.ca.pem", "certs/minivault.ca.pem"]
usesystempool = false

[webtls]
type = "dev"
